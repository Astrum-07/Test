<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Test Tizimi</title>
    <!-- Kutubxonalar -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;700;900&display=swap');
        
        :root {
            --emerald: #10b981;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: #020617; 
            color: #f8fafc; 
            overflow-x: hidden;
        }

        .mono { font-family: 'Space Mono', monospace; }

        /* Matrix Fon */
        .matrix-canvas { position: fixed; top: 0; left: 0; z-index: 0; opacity: 0.15; pointer-events: none; }
        
        .content-wrap { position: relative; z-index: 10; }

        /* Sharp Glass Effect */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 0px; /* To'rtburchak */
        }

        /* Sharp Buttons */
        .sharp-btn {
            border-radius: 0px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 0.1em;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .sharp-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--emerald); }

        /* Animations */
        .fade-up { animation: fadeUp 0.6s ease-out forwards; opacity: 0; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-4 md:p-12 custom-scrollbar">
    <canvas id="matrix" class="matrix-canvas"></canvas>

    <div id="main-content" class="content-wrap hidden max-w-7xl mx-auto">
        <!-- HEADER -->
        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-16 gap-8 fade-up">
            <div>
                <div class="flex items-center gap-4 mb-2">
                    <div class="w-12 h-12 bg-emerald-500 flex items-center justify-center text-black font-black text-2xl">A</div>
                    <h1 class="text-3xl font-black uppercase tracking-tighter italic">Boshqaruv_Paneli</h1>
                </div>
                <p class="text-emerald-500 mono text-xs font-bold tracking-[0.3em]">Test Tizimi</p>
            </div>
            
            <div class="flex flex-wrap gap-3 w-full lg:w-auto">

                <button onclick="exportToPDF()" class="sharp-btn flex-1 lg:flex-none bg-emerald-600 hover:bg-emerald-500 text-black px-6 py-3 text-[10px]">PDF_Yuklash</button>
                <button onclick="logout()" class="sharp-btn flex-1 lg:flex-none border-white/10 hover:bg-white/10 text-white px-6 py-3 text-[10px]">Chiqish</button>
            </div>
        </div>

        <!-- STATS -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12 fade-up" style="animation-delay: 0.2s;">
            <div class="glass-card p-8 border-l-4 border-emerald-500">
                <p class="text-zinc-500 text-[10px] uppercase font-bold tracking-widest mb-2">Jami Topshirganlar</p>
                <h3 class="text-5xl font-black mono" id="stat-total">0</h3>
            </div>
            <div class="glass-card p-8 border-l-4 border-emerald-500">
                <p class="text-zinc-500 text-[10px] uppercase font-bold tracking-widest mb-2">O'rtacha Ball</p>
                <h3 class="text-5xl font-black mono text-emerald-500" id="stat-avg">0%</h3>
            </div>
            <div class="glass-card p-8 border-l-4 border-emerald-500 text-right flex flex-col justify-between">
                <p class="text-zinc-500 text-[10px] uppercase font-bold tracking-widest mb-2 text-left">Baza Sozlamalari</p>
                <button onclick="clearAllData()" class="sharp-btn bg-red-600/20 border-red-600/50 text-red-500 hover:bg-red-600 hover:text-white py-2 px-4 text-[10px]">
                    Barcha natijalarni o'chirish
                </button>
            </div>
        </div>

        <!-- TABLE -->
        <div class="glass-card fade-up shadow-2xl" style="animation-delay: 0.4s;">
            <div class="p-6 border-b border-white/5 flex justify-between items-center bg-white/5">
                <h2 class="text-xs font-black uppercase tracking-[0.4em] text-zinc-400">Natijalar jadvali</h2>
                <div class="w-3 h-3 bg-emerald-500 animate-pulse"></div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left" id="results-table-main">
                    <thead>
                        <tr class="bg-white/5 text-emerald-500 text-[10px] uppercase font-black tracking-widest">
                            <th class="p-6 border-b border-white/5">O'rin</th>
                            <th class="p-6 border-b border-white/5">F.I.SH (O'quvchi)</th>
                            <th class="p-6 border-b border-white/5">To'g'ri / Jami</th>
                            <th class="p-6 border-b border-white/5 text-center">Foiz</th>
                            <th class="p-6 border-b border-white/5 text-right">Sana / Vaqt</th>
                        </tr>
                    </thead>
                    <tbody id="results-table-body" class="text-sm font-medium">
                        <!-- Ma'lumotlar -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = "https://69080b1eb49bea95fbf23575.mockapi.io/api/v1";
        const ADMIN_PASS = "0412";

        // Matrix Fon
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const drops = Array(Math.floor(canvas.width / 16)).fill(1);
        function drawMatrix() {
            ctx.fillStyle = "rgba(2, 6, 23, 0.1)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#10b981"; ctx.font = "14px monospace";
            drops.forEach((y, i) => {
                const text = String.fromCharCode(0x30A0 + Math.random() * 96);
                ctx.fillText(text, i * 16, y * 16);
                if (y * 16 > canvas.height && Math.random() > 0.985) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(drawMatrix, 60);

        // Kirish va Xavfsizlik
        async function checkAccess() {
            const isAuth = localStorage.getItem('admin_auth');
            if (isAuth === 'true') {
                showDashboard();
            } else {
                const { value: password } = await Swal.fire({
                    title: 'ADMIN KIRISH',
                    input: 'password',
                    inputPlaceholder: 'PAROLNI KIRITING',
                    background: '#020617', color: '#10b981',
                    confirmButtonColor: '#10b981', confirmButtonText: 'KIRISH',
                    allowOutsideClick: false,
                    customClass: { popup: 'border border-emerald-500 rounded-none', input: 'bg-black border-emerald-900 text-emerald-500 rounded-none font-mono text-center' }
                });
                if (password === ADMIN_PASS) { localStorage.setItem('admin_auth', 'true'); showDashboard(); }
                else { Swal.fire({ icon: 'error', title: 'Xato!', text: 'Parol noto\'g\'ri.', background: '#0f172a', color: '#ef4444' }).then(checkAccess); }
            }
        }

        function showDashboard() { document.getElementById('main-content').classList.remove('hidden'); loadResults(); }
        function logout() { localStorage.removeItem('admin_auth'); location.reload(); }

        async function loadResults() {
            try {
                const res = await fetch(`${BASE_URL}/results`);
                const data = await res.json();
                data.sort((a, b) => b.percent - a.percent);

                const total = data.length;
                const avg = total > 0 ? Math.round(data.reduce((s, i) => s + i.percent, 0) / total) : 0;

                document.getElementById('stat-total').innerText = total;
                document.getElementById('stat-avg').innerText = avg + '%';

                const tableBody = document.getElementById('results-table-body');
                tableBody.innerHTML = data.map((item, index) => `
                    <tr class="border-b border-white/5 hover:bg-emerald-500/5 transition-colors">
                        <td class="p-6 mono font-bold ${index < 3 ? 'text-emerald-500' : 'text-zinc-600'} italic">#${index + 1}</td>
                        <td class="p-6 uppercase font-black tracking-tight text-zinc-200">${item.surname} ${item.name}</td>
                        <td class="p-6 mono text-zinc-400">${item.score} / ${item.total || '30'}</td>
                        <td class="p-6 text-center"><span class="px-3 py-1 font-black mono text-lg ${item.percent >= 80 ? 'text-emerald-400' : 'text-zinc-200'}">${item.percent}%</span></td>
                        <td class="p-6 text-right text-[10px] text-zinc-500 mono uppercase">${item.date}</td>
                    </tr>
                `).join('');
            } catch (err) { console.error(err); }
        }

        // --- BARCHASINI O'CHIRISH FUNKSIYASI ---
        async function clearAllData() {
            const { value: password } = await Swal.fire({
                title: 'TASDIQLASH',
                text: 'Barcha ma\'lumotlarni o\'chirish uchun admin parolini qayta kiriting:',
                input: 'password',
                background: '#020617', color: '#f8fafc',
                confirmButtonColor: '#ef4444', confirmButtonText: 'TEKSHIRISH',
                customClass: { popup: 'border border-red-500 rounded-none' }
            });

            if (password === ADMIN_PASS) {
                const result = await Swal.fire({
                    title: 'IShonchingiz komilmi?',
                    text: "Barcha natijalar bazadan butunlay o'chib ketadi! Buni qaytarib bo'lmaydi.",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    cancelButtonColor: '#3085d6',
                    confirmButtonText: 'HA, O\'CHIRILSIN!',
                    cancelButtonText: 'BEKOR QILISH',
                    background: '#020617', color: '#f8fafc'
                });

                if (result.isConfirmed) {
                    Swal.fire({ title: 'O\'chirilmoqda...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                    
                    try {
                        // Barcha natijalarni olish
                        const res = await fetch(`${BASE_URL}/results`);
                        const data = await res.json();
                        
                        // Ketma-ket o'chirish (MockAPI uchun)
                        for (let item of data) {
                            await fetch(`${BASE_URL}/results/${item.id}`, { method: 'DELETE' });
                        }

                        Swal.fire({ icon: 'success', title: 'Tozalandi!', text: 'Barcha natijalar muvaffaqiyatli o\'chirildi.', background: '#020617', color: '#10b981' });
                        loadResults();
                    } catch (err) {
                        Swal.fire({ icon: 'error', title: 'Xato!', text: 'O\'chirishda muammo yuz berdi.' });
                    }
                }
            } else if (password) {
                Swal.fire({ icon: 'error', title: 'Xato!', text: 'Parol noto\'g\'ri, ruxsat berilmadi.' });
            }
        }

        function refreshData() { loadResults(); }

        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(18); doc.text("IMTIHON NATIJALARI HISOBOTI", 14, 20);
            doc.autoTable({
                html: '#results-table-main', startY: 30, theme: 'striped',
                headStyles: { fillColor: [16, 185, 129] }, styles: { font: 'courier' }
            });
            doc.save(`Hisobot_${new Date().getTime()}.pdf`);
        }

        checkAccess();
    </script>
</body>
</html>
